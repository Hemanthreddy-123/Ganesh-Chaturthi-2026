services:
  - type: web
    name: ganesh-whatsapp-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false        # You will fill this in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false        # You will fill this in Render dashboard
    healthCheckPath: /health
